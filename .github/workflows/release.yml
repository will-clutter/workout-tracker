name: Auto Changelog Builder

on:
  push:
    branches:
      - main # Change this to master if that's what your default branch is called

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: node # This tells the bot to maintain a standard CHANGELOG.md file