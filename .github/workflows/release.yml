name: Auto Changelog Builder

on:
  push:
    branches:
      - main # Change this to master if that's what your default branch is called

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json # maintains CHANGELOG.md and bumps sw.js
          manifest-file: .release-please-manifest.json